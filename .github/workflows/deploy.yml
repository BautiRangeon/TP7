
name: Publicar React

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar React
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
